<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#08080a">
<title>DubLab</title>
<style>html,body{margin:0;min-height:100%;background:#08080a;color:#fff;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{display:grid;place-items:center;min-height:100vh}.load{max-width:32rem;padding:2rem;text-align:center;color:#aaa}.load b{display:block;color:#fff;font-size:1.5rem;margin-bottom:.5rem}.load small{display:block;margin-top:.75rem;color:#777;line-height:1.4}</style>
</head>
<body><div class="load" id="s"><b>DubLab</b>Loading the studio…</div>
<script>
(async()=>{
 const status=document.getElementById('s');
 const loadPako=()=>new Promise((resolve,reject)=>{
   if(window.pako)return resolve();
   const x=document.createElement('script');
   x.src='https://cdn.jsdelivr.net/npm/pako@2.1.0/dist/pako.min.js';
   x.onload=resolve;x.onerror=()=>reject(new Error('Could not load the compatibility decoder. Check your internet connection and refresh.'));
   document.head.appendChild(x);
 });
 async function gunzipBytes(u){
   if('DecompressionStream' in window){
     const stream=new Blob([u]).stream().pipeThrough(new DecompressionStream('gzip'));
     return new Uint8Array(await new Response(stream).arrayBuffer());
   }
   status.innerHTML='<b>DubLab</b>Loading browser compatibility layer…';
   await loadPako();
   return window.pako.ungzip(u);
 }
 window.__dublabGunzip=async blob=>{
   const u=new Uint8Array(await blob.arrayBuffer());
   const out=await gunzipBytes(u);
   return out.buffer.slice(out.byteOffset,out.byteOffset+out.byteLength);
 };
 try{
  const parts=await Promise.all([0,1,2,3].map(async i=>{const r=await fetch(`app/p${i}.txt?v=3`);if(!r.ok)throw new Error(`Missing app part ${i}`);return r.text()}));
  const b=atob(parts.join('').replace(/\s/g,'')),u=new Uint8Array(b.length);
  for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);
  const out=await gunzipBytes(u);
  let t=new TextDecoder().decode(out);
  const oldPack=`async function unpackScene(s,blob){\n  if(!('DecompressionStream' in window))throw new Error('Please use a current version of Chrome.');\n  const ab=await new Response(blob.stream().pipeThrough(new DecompressionStream('gzip'))).arrayBuffer(), files=tarFiles(ab), urls=[];`;
  const newPack=`async function unpackScene(s,blob){\n  const ab=await window.__dublabGunzip(blob), files=tarFiles(ab), urls=[];`;
  t=t.replace(oldPack,newPack);
  document.open();document.write(t);document.close();
 }catch(e){
  console.error(e);
  const msg=(e&&e.message)?e.message:'Unknown startup error';
  status.innerHTML='<b>DubLab could not start</b>'+msg+'<small>Refresh the page. If it still fails, send Mr V a screenshot of this message.</small>';
 }
})();
</script></body></html>
