<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#08080a">
<title>DubLab</title>
<style>html,body{margin:0;min-height:100%;background:#08080a;color:#fff;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{display:grid;place-items:center;min-height:100vh}.load{max-width:30rem;padding:2rem;text-align:center;color:#aaa}.load b{display:block;color:#fff;font-size:1.5rem;margin-bottom:.5rem}</style>
</head>
<body><div class="load" id="s"><b>DubLab</b>Loading the studio…</div>
<script>
(async()=>{
 try{
  if(!('DecompressionStream' in window)) throw new Error('DecompressionStream unavailable');
  const parts=await Promise.all([0,1,2,3].map(async i=>{const r=await fetch(`app/p${i}.txt`);if(!r.ok)throw new Error(`Missing app part ${i}`);return r.text()}));
  const b=atob(parts.join('').replace(/\s/g,'')),u=new Uint8Array(b.length);
  for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);
  const stream=new Blob([u]).stream().pipeThrough(new DecompressionStream('gzip'));
  const t=await new Response(stream).text();
  document.open();document.write(t);document.close();
 }catch(e){
  console.error(e);
  document.getElementById('s').innerHTML='<b>DubLab could not start</b>Please open this page in the latest version of Chrome.';
 }
})();
</script></body></html>
