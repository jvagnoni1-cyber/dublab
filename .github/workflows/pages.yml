name: Deploy DubLab to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Restore FFmpeg cache
        uses: actions/cache@v4
        with:
          path: tools/ffmpeg
          key: dublab-ffmpeg-master-linux64-v1

      - name: Install current FFmpeg
        run: |
          if [ ! -x tools/ffmpeg/ffmpeg ]; then
            mkdir -p tools/ffmpeg /tmp/ffmpeg-build
            curl -L --fail --retry 3 -o /tmp/ffmpeg.tar.xz https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz
            tar -xJf /tmp/ffmpeg.tar.xz -C /tmp/ffmpeg-build --strip-components=1
            cp /tmp/ffmpeg-build/bin/ffmpeg /tmp/ffmpeg-build/bin/ffprobe tools/ffmpeg/
            chmod +x tools/ffmpeg/ffmpeg tools/ffmpeg/ffprobe
          fi
          echo "$GITHUB_WORKSPACE/tools/ffmpeg" >> "$GITHUB_PATH"
          tools/ffmpeg/ffmpeg -version | head -1

      - name: Restore converted scene cache
        uses: actions/cache@v4
        with:
          path: |
            site/assets/scenes
            site/scenes.generated.json
          key: dublab-browser-scenes-v4

      - name: Patch legacy OGV stream selection
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/build_student_site.py')
          s=p.read_text()
          old="run(['ffmpeg','-y','-i',str(video),'-an','-vf',vf"
          new="run(['ffmpeg','-y','-i',str(video),'-map','0:v:0','-an','-vf',vf"
          if old not in s:
              raise SystemExit('Expected video transcode line not found')
          p.write_text(s.replace(old,new))
          PY

      - name: Build student site and scene library
        run: python scripts/build_student_site.py

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload student site
        uses: actions/upload-pages-artifact@v4
        with:
          path: "site"

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
