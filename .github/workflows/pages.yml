name: Deploy DubLab to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Restore converted scene cache
        uses: actions/cache@v4
        with:
          path: |
            site/assets/scenes
            site/scenes.generated.json
          key: dublab-browser-scenes-v1

      - name: Install media tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          ffmpeg -version | head -1

      - name: Build student site and scene library
        run: python scripts/build_student_site.py

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload student site
        uses: actions/upload-pages-artifact@v4
        with:
          path: "site"

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
