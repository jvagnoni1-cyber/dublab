name: Deploy DubLab to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Restore converted scene cache
        uses: actions/cache@v4
        with:
          path: |
            site/assets/scenes
            site/scenes.generated.json
          key: dublab-browser-scenes-v3

      - name: Install media tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          ffmpeg -version | head -1

      - name: Patch source-video handling
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/build_student_site.py')
          s=p.read_text()
          old="video=first(src,[r'^dub_video\\.(ogv|mp4|webm|mkv)$']);backing=first(src,[r'^_backing_track\\.(mp3|ogg|wav|m4a)$'])"
          new="backing=first(src,[r'^_backing_track\\.(mp3|ogg|wav|m4a)$']); video=work/'preview.mp4'; download(cfg['url'].split('/download/')[0]+'/web/preview.mp4',video)"
          if old not in s:
              raise SystemExit('Expected source media line not found')
          s=s.replace(old,new)
          old2="run(['ffmpeg','-y','-i',str(video),'-an','-vf',vf"
          new2="run(['ffmpeg','-y','-i',str(video),'-map','0:v:0','-an','-vf',vf"
          if old2 in s:s=s.replace(old2,new2)
          p.write_text(s)
          PY

      - name: Build student site and scene library
        run: python scripts/build_student_site.py

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload student site
        uses: actions/upload-pages-artifact@v4
        with:
          path: "site"

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
