name: Deploy DubLab classroom bundle

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Download classroom bundle
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          TAG="${RELEASE_TAG:-classroom-build}"
          mkdir -p /tmp/dublab-release /tmp/dublab-unpacked site
          echo "Downloading DubLab bundle from release: $TAG"
          gh release download "$TAG" --repo "$GH_REPO" --pattern '*.zip' --dir /tmp/dublab-release
          ZIP="$(find /tmp/dublab-release -maxdepth 1 -type f -name '*.zip' | head -n 1)"
          test -n "$ZIP" || { echo 'No ZIP asset found on the release.'; exit 1; }
          unzip -q "$ZIP" -d /tmp/dublab-unpacked
          ROOT="$(find /tmp/dublab-unpacked -type f -name index.html -printf '%h\n' | head -n 1)"
          test -n "$ROOT" || { echo 'The ZIP does not contain index.html.'; exit 1; }
          cp -a "$ROOT"/. site/
          rm -rf site/__pycache__ site/run_server.py "site/Run DubLab.command" site/README.txt
          touch site/.nojekyll
          test -f site/index.html
          test -d site/assets/scenes
          echo "Classroom bundle ready: $(du -sh site | cut -f1)"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload student site
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
