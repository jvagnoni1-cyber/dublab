name: Inline DubLab app

on:
  push:
    paths:
      - '.github/workflows/inline-app.yml'

permissions:
  contents: write

jobs:
  inline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Build single-file student app
        shell: bash
        run: cat app/p0.txt app/p1.txt app/p2.txt app/p3.txt | tr -d '\n\r ' | base64 -d | gzip -d > index.html
      - name: Commit single-file app
        shell: bash
        run: git config user.name 'github-actions[bot]' && git config user.email '41898282+github-actions[bot]@users.noreply.github.com' && git add index.html && (git diff --cached --quiet || (git commit -m 'Publish DubLab as single-file web app' && git push))
